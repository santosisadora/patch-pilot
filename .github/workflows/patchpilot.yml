name: patchpilot

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  pipeline:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Restore findings database
        uses: actions/cache@v4
        with:
          path: data/patchpilot.db
          key: patchpilot-db-${{ github.run_id }}
          restore-keys: patchpilot-db-

      - name: Scan with Trivy
        run: |
          mkdir -p data
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs --format json --output /src/data/scan_demo.json /src/demo-app

      - name: Run Patch Pilot
        shell: bash
        run: |
          git config user.name "patchpilot-bot"
          git config user.email "patchpilot-bot@users.noreply.github.com"
          LOG="$RUNNER_TEMP/pipeline.log"
          python src/run_pipeline.py --apply 2>&1 | tee "$LOG"
          { echo '```'; cat "$LOG"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=$(git branch --list 'patchpilot/auto-*' --format='%(refname:short)' | head -n1)
          if [ -z "$BRANCH" ]; then echo "No upgrades to propose."; exit 0; fi
          git push -f origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "PatchPilot: automated dependency upgrades" \
            --body-file "$(ls data/pr_*.md | tail -n1)" || echo "PR already exists"

      - uses: actions/upload-artifact@v4
        with:
          name: patchpilot-output
          path: |
            data/findings.csv
            data/trend.csv
            data/pr_*.md